; Asphodel — committed, reproducible Godot 4.4 export presets.
;
; Two presets:
;   [preset.0] "Windows Desktop"  — the shipped Windows x86_64 client.
;   [preset.1] "Linux/X11"        — a Linux-runnable proxy build used as
;                                    build evidence on Linux/headless hosts
;                                    (this milestone's certification env).
;
; Reproducibility rules honored here:
;   * export_path values are RELATIVE (dist/...), resolved against the Godot
;     project dir (godot/). No machine-specific absolute paths.
;   * No secrets, signing identities, or per-machine template overrides.
;   * export_filter="all_resources" packs every Godot resource; include_filter
;     additionally packs the raw city data (bundles/**/*.json and the gzipped
;     world tiles bundles/**/*.gz) plus the sample_bundle and catalog, which are
;     plain data files Godot would not otherwise treat as resources.
;
; Windows export additionally requires the 4.4 Windows export templates on the
; build host; Linux export requires the 4.4 Linux templates. tools/
; build_windows_playable.py detects and reports missing templates honestly.

[preset.0]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="*.json, *.gz, *.gdshader"
exclude_filter="tests/*, *.import.md5, *.tmp"
export_path="dist/asphodel-windows-v2/Asphodel.exe"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=1
binary_format/embed_pck=false
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
application/modify_resources=true
application/icon=""
application/console_wrapper_icon=""
application/icon_interpolation=4
application/file_version=""
application/product_version=""
application/company_name="Asphodel"
application/product_name="Asphodel"
application/file_description="Asphodel — embodied city simulation client"
application/copyright=""
application/trademarks=""
application/export_angle=0
application/export_d3d12=0
application/d3d12_agility_sdk_multiarch=true
ssh_remote_deploy/enabled=false
codesign/enable=false
codesign/timestamp=true
codesign/timestamp_server_url=""
codesign/digest_algorithm=1
codesign/description=""
codesign/custom_options=PackedStringArray()

[preset.1]

name="Linux/X11"
platform="Linux/X11"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="*.json, *.gz, *.gdshader"
exclude_filter="tests/*, *.import.md5, *.tmp"
export_path="dist/asphodel-linux-v2/Asphodel.x86_64"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.1.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=1
binary_format/embed_pck=false
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
ssh_remote_deploy/enabled=false
